<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Auto-Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">
    <h1>Analizador Automático de personas que no te siguen.</h1>
    <p class="description">Selecciona ambos archivos HTML a la vez (following y followers)</p>
    
    <div class="upload-area" id="dropZone">
        <p id="msg">Haz clic aquí o arrastra los archivos</p>
        <input type="file" id="fileInput" multiple accept=".html">
    </div>

    <div id="status" class="status"></div>

    <div id="results">
        <div class="count" id="summary"></div>
        <p class="label-results">Personas que no te siguen de vuelta:</p>
        <pre id="userList"></pre>
        <button id="downloadBtn" class="btn-download" onclick="downloadTxt()">Descargar archivo .txt</button>
    </div>
   <a href="otra_pagina.html" class="btn">Tutorial</a>


</div>

    <script src="script.js"></script>
</body>
</html>
